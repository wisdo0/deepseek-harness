<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>probe</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Segoe UI", sans-serif; }
  body { background: #0b1020; overflow: hidden; }
  #bg {
    position: fixed; inset: -20%; z-index: 0;
    background: radial-gradient(circle at 30% 30%, #3b82f6, transparent 60%),
                radial-gradient(circle at 70% 70%, #a855f7, transparent 60%);
    filter: blur(40px); opacity: .5;
    animation: drift 6s ease-in-out infinite alternate;
  }
  @keyframes drift { from { transform: translate3d(-3%, -2%, 0) } to { transform: translate3d(3%, 2%, 0) } }
  #app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }
  header {
    height: 52px; flex: none; display: flex; align-items: center; padding: 0 16px; color: #e5e7eb;
    background: rgba(15, 23, 42, .55);
    backdrop-filter: blur(18px) saturate(1.6);
    -webkit-backdrop-filter: blur(18px) saturate(1.6);
    border-bottom: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 8px 32px rgba(0,0,0,.45);
  }
  #list { flex: 1; overflow-y: auto; padding: 10px 16px; }
  .row {
    margin: 6px 0; padding: 10px 14px; border-radius: 10px; color: #dbeafe; font-size: 13px;
    background: rgba(30, 41, 59, .62);
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 3px 10px rgba(0,0,0,.3);
  }
  #hud { position: fixed; right: 12px; bottom: 12px; z-index: 99; color: #fff; font: 600 20px monospace;
         background: rgba(0,0,0,.8); padding: 8px 14px; border-radius: 10px; }
</style></head>
<body>
<div id="bg"></div>
<div id="app"><header>GPU compositing probe</header><div id="list"></div></div>
<div id="hud">measuring…</div>
<script>
const list = document.getElementById('list');

// ?lite=1 时加载 lite.css，用来量样式本身的收益（与浏览器标志解耦）
if (location.search.includes('lite')) {
  const l = document.createElement('link');
  l.rel = 'stylesheet';
  l.href = '/lite.css';
  document.head.appendChild(l);
}

const ROWS = 250;
let html = '';
for (let i = 0; i < ROWS; i++) {
  html += '<div class="row">Row ' + i + ' — quick brown fox 中文渲染测试 ' + i + '</div>';
}
list.innerHTML = html;

function glInfo() {
  try {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    const gl = c.getContext('webgl2') || c.getContext('webgl');
    if (!gl) return { renderer: 'no-webgl' };
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    return { renderer: ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : 'no-ext',
             vendor: ext ? gl.getParameter(ext.UNMASKED_VENDOR_WEBGL) : 'no-ext',
             ver: gl.getParameter(gl.VERSION) };
  } catch (e) { return { renderer: 'err:' + e.message }; }
}

// 持续滚动 + 持续重绘，制造渲染压力
(function scrollLoop() {
  list.scrollTop += 18;
  if (list.scrollTop + list.clientHeight >= list.scrollHeight - 3) list.scrollTop = 0;
  requestAnimationFrame(scrollLoop);
})();

function send(payload) {
  document.getElementById('hud').textContent = payload.error ? 'throttled' : payload.fps + ' fps';
  fetch('/report', { method: 'POST', body: JSON.stringify(payload) });
}

// 预热：窗口刚打开时 Chromium 会节流 rAF，直接开测会测出一堆几百毫秒的假数据。
// 必须等连续 10 帧都稳定在 50ms 以内，才开始正式计时。
function startMeasure() {
  const WARM_FRAMES = 10;
  const MEASURE_MS = 3000;
  const WARM_TIMEOUT_MS = 8000;

  let prev = 0;
  let warm = 0;
  let measuring = false;
  let measureStart = 0;
  const deltas = [];
  const t0 = performance.now();

  function tick(now) {
    if (prev) {
      const dt = now - prev;
      if (!measuring) {
        if (dt < 50) warm++; else warm = 0;
        if (warm >= WARM_FRAMES) { measuring = true; measureStart = now; }
      } else {
        deltas.push(dt);
      }
    }
    prev = now;

    if (!measuring) {
      if (now - t0 > WARM_TIMEOUT_MS) { send({ error: 'throttled', warm }); return; }
      requestAnimationFrame(tick);
      return;
    }
    if (now - measureStart > MEASURE_MS) {
      const v = deltas.filter(d => d > 0).sort((a, b) => a - b);
      const avg = v.reduce((a, b) => a + b, 0) / (v.length || 1);
      send({
        fps: +(1000 / avg).toFixed(1),
        avgMs: +avg.toFixed(1),
        p95Ms: +(v[Math.floor(v.length * 0.95)] || 0).toFixed(1),
        n: v.length,
        gl: glInfo(),
        cpus: navigator.hardwareConcurrency,
        vp: window.innerWidth + 'x' + window.innerHeight
      });
      return;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

fetch('/ping');
setTimeout(startMeasure, 800);
</script>
</body></html>
