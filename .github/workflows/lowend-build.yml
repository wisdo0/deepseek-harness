name: lowend-build

on:
  push:
    branches: [lowend-win]
  pull_request:
    branches: [master, lowend-win]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: 校验并打包启动器
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 PowerShell 脚本编码（UTF-8 BOM）
        shell: pwsh
        run: |
          # Windows PowerShell 5.1 对无 BOM 的 UTF-8 按 ANSI(GBK) 解析，
          # 中文字符串会直接导致语法错误。这个坑必须挡住。
          $bad = @()
          Get-ChildItem -Path lowend -Recurse -Filter *.ps1 | ForEach-Object {
            $b = [IO.File]::ReadAllBytes($_.FullName)
            $hasBom = ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)
            if (-not $hasBom) {
              Write-Host "::error file=$($_.FullName)::缺少 UTF-8 BOM，PS 5.1 下中文会解析失败"
              $bad += $_.Name
            } else {
              Write-Host "OK (BOM) $($_.Name)"
            }
          }
          if ($bad.Count -gt 0) { throw "缺少 UTF-8 BOM: $($bad -join ', ')" }

      - name: 校验 PowerShell 脚本可解析
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path lowend -Recurse -Filter *.ps1
          if (-not $files) { throw '没有找到任何 .ps1' }
          foreach ($f in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host "::error file=$($f.FullName)::$($_.Message)" }
              throw "解析失败: $($f.Name)"
            }
            Write-Host "OK $($f.Name)"
          }

      - name: 校验 Node 探针语法
        shell: pwsh
        run: |
          Get-ChildItem -Path lowend -Recurse -Filter *.mjs | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "语法错误: $($_.Name)" }
            Write-Host "OK $($_.Name)"
          }

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 干净环境验证启动器（Windows PowerShell 5.1 实测）
        shell: pwsh
        run: |
          # 这一层专治"路径写死"：真装一份 dsh，让脚本自己去探测。
          # 特意用 powershell.exe(5.1) 而不是 pwsh(7)，这样 BOM/编码问题也会暴露。
          $root = Join-Path $env:RUNNER_TEMP 'dsh-root'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Push-Location $root
          try {
            npm install @deepseek-ai/dsh --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'npm install 失败' }
          } finally {
            Pop-Location
          }
          $bin = Join-Path $root 'node_modules\@deepseek-ai\dsh\lib\bin.js'
          if (-not (Test-Path $bin)) { throw "dsh 未安装到位: $bin" }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\lowend\dsh-gpu.ps1 -Check -DshDir $root
          if ($LASTEXITCODE -ne 0) { throw "启动器自检失败 (exit $LASTEXITCODE)" }
          Write-Host '启动器探测正常'

      - name: 打包
        shell: pwsh
        run: |
          $out = 'dist/dsh-lowend-win-x64.zip'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path lowend\* -DestinationPath $out -Force
          Get-Item $out | Select-Object FullName, Length | Format-List
          $hash = (Get-FileHash $out -Algorithm SHA256).Hash
          "SHA256=$hash" | Tee-Object -FilePath dist\SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-lowend-win-x64
          path: |
            dist/dsh-lowend-win-x64.zip
            dist/SHA256.txt
          if-no-files-found: error
